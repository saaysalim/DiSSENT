<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courses Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nav: #0a2b57;
      --nav-dark: #08274d;
      --accent: #1c63ff;
      --bg: #bfe9ff;
      --card: #ffffff;
      --muted: #6a7a90;
      --shadow: 0 18px 40px rgba(9, 38, 74, 0.2);
      --pill: #0f2f64;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #88b9ff 0%, #bfe9ff 35%, #cbefff 100%);
      color: #0b1a2f;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      display: grid;
      gap: 26px;
    }

    .nav {
      background: linear-gradient(180deg, var(--nav) 0%, var(--nav-dark) 100%);
      color: #eaf3ff;
      padding: 14px 24px;
      box-shadow: 0 10px 20px rgba(8, 26, 60, 0.35);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 24px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      font-weight: 600;
      font-size: 14px;
    }

    .nav-links a {
      color: inherit;
      text-decoration: none;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px;
      border-radius: 12px;
    }

    .lang-switch button {
      border: none;
      background: transparent;
      color: #d9e6ff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .lang-switch button.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-weight: 600;
    }

    .title {
      text-align: center;
      font-size: clamp(26px, 3.4vw, 36px);
      font-weight: 700;
      color: var(--accent);
      margin: 12px 0 6px;
    }

    .course-list {
      display: grid;
      gap: 18px;
    }

    .course-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
      display: grid;
      gap: 14px;
      border: 1px solid rgba(10, 43, 87, 0.08);
    }

    .course-card h3 {
      margin: 0;
      font-size: 20px;
      text-align: center;
      color: #0d3c91;
    }

    .course-card p {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .course-card .actions {
      display: flex;
      justify-content: center;
    }

    .course-card button {
      background: var(--pill);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(10, 43, 87, 0.25);
    }

    .page-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Feedback</a>
        <a href="#">Video</a>
      </div>
      <div class="lang-switch" role="group" aria-label="Language selector">
        <button class="active" type="button">English</button>
        <button type="button">Arabic</button>
        <button type="button">French</button>
        <button type="button">Farsi</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 class="title">Courses</h1>
    <section class="course-list">
      <article class="course-card">
        <h3>Intro to Math</h3>
        <p>Learn basic math concepts</p>
        <div class="actions">
          <button type="button">View Course</button>
        </div>
      </article>
      <article class="course-card">
        <h3>Intro to Science</h3>
        <p>Introduction to science for kids</p>
        <div class="actions">
          <button type="button">View Course</button>
        </div>
      </article>
      <article class="course-card">
        <h3>Intro to Language</h3>
        <p>Build reading and writing skills</p>
        <div class="actions">
          <button type="button">View Course</button>
        </div>
      </article>
    </section>
    <p class="page-note">Interface styled to match the provided reference.</p>
  </div>
</body>
</html>
