# DiSSENT Apache settings (copied into the image by Dockerfile).

# Do not tell visitors which Apache or OS version runs the site.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
</Directory>

# Styled "Page not found" for every missing address.
ErrorDocument 404 /Pages/not_found.php

# PHP helpers and shared page parts are only included by pages, never opened directly.
<DirectoryMatch "^/var/www/html/(backend|includes)(/|$)">
    Require all denied
</DirectoryMatch>

# Database dumps, backups, settings, notes and hidden files are never served.
<FilesMatch "(?i)\.(sql|bak|backup|old|orig|save|swp|ini|conf|cfg|log|env|md|json|lock|dist|sh|ps1|yml|yaml)$|\.backup-|^\.">
    Require all denied
</FilesMatch>

# Uploaded pictures are only ever shown as images: never run PHP there.
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
</Directory>
