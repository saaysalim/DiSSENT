spring.application.name=securecomm
app.receiverId=System1
server.port=8081
#MongoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=securecomm

#Kafka
spring.kafka.bootstrap-servers=localhost:9092

#Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#Consumer Config
spring.kafka.consumer.group-id=securecomm-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

otel.traces.exporter=none
otel.metrics.exporter=none

#Fabric (Org1)
fabric.connection-profile=connection-org1.json
fabric.cert-path=cert.pem
fabric.key-path=key.pem
fabric.msp-id=Org1MSP
fabric.user-label=appUser1
fabric.channel=mychannel
fabric.chaincode=verification

#This system's identity on the ledger's public-key registry
app.identity.user-id=System1
app.identity.org-id=Org1

#Kafka topics
app.kafka.verification-topic=verification-events
app.kafka.messages-topic=secure-messages

#Pre-shared AES-256 key (base64) for the messaging bridge — dev-only value, override via
#the API_CRYPTO_AES_KEY_BASE64 env var for any real deployment.
app.crypto.aes-key-base64=${API_CRYPTO_AES_KEY_BASE64:kP9hC3lNmuk/76r6UV8C6vnz8xvK/SHZtqCsIX2xrho=}

#Shared secret required in the X-API-Key header on every /api/** call — dev-only value,
#override via the API_KEY env var for any real deployment.
api.key=${API_KEY:dev-only-change-me}
