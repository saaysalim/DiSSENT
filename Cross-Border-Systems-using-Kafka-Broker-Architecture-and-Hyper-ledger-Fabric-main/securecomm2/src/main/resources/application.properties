spring.application.name=securecomm-system2
app.receiverId=System2
server.port=8082
# MongoDB config (if running second local Mongo instance, change port)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=securecomm2

# Kafka - pointing to different external port
spring.kafka.bootstrap-servers=localhost:9092

# Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer Config
spring.kafka.consumer.group-id=securecomm2-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#OpenTelemetry (pulled in by the Fabric SDK) is disabled in the main() method; these settings
#cannot go here because OTel reads only JVM system properties / OTEL_* env vars.

#Fabric (Org2)
fabric.connection-profile=connection-org2.json
fabric.cert-path=cert.pem
fabric.key-path=key.pem
fabric.msp-id=Org2MSP
fabric.user-label=appUser2
fabric.channel=mychannel
fabric.chaincode=verification

#Kafka topics
app.kafka.messages-topic=secure-messages
app.kafka.verification-topic=verification-events

#Pre-shared AES-256 key (base64) — MUST match securecomm's app.crypto.aes-key-base64.
#Dev-only value below; override via the API_CRYPTO_AES_KEY_BASE64 env var for any real deployment.
app.crypto.aes-key-base64=${API_CRYPTO_AES_KEY_BASE64:kP9hC3lNmuk/76r6UV8C6vnz8xvK/SHZtqCsIX2xrho=}

#Shared secret required in the X-API-Key header on every /api/** call — dev-only value,
#Shared API key; must match PHP. Set the DISSENT_API_KEY env var (see .env). No default.
api.key=${DISSENT_API_KEY:}
