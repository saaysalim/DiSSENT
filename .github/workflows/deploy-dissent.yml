# Builds every DiSSENT PHP page in its own job, reports the status of each page,
# then deploys the site to GitHub Pages.
# Runs automatically on every push to main, or manually from the Actions tab.
# This is the only workflow that deploys to GitHub Pages.
# All actions use versions that run on Node.js 24.

name: Build and deploy DiSSENT pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1. Find all the pages in docs/Pages
  find-pages:
    name: Find pages
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.list.outputs.pages }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: List PHP pages
        id: list
        run: |
          # Backend endpoints, not pages people visit. Edit this list if needed.
          skip="logout send_message get_new_messages message_status"
          pages=()
          for f in docs/Pages/*.php; do
            name=$(basename "$f" .php)
            if [[ " $skip " == *" $name "* ]]; then continue; fi
            pages+=("\"$name\"")
          done
          json="[$(IFS=,; echo "${pages[*]}")]"
          echo "Pages found: $json"
          echo "pages=$json" >> "$GITHUB_OUTPUT"

  # 2. Build each page in its own job (one box per page)
  build-page:
    name: Build ${{ matrix.page }}
    needs: find-pages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJson(needs.find-pages.outputs.pages) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Render ${{ matrix.page }}.php
        run: |
          php -d display_errors=0 -S 127.0.0.1:8888 -t . > php-server.log 2>&1 &
          sleep 2
          mkdir -p out
          result=$(curl -s -L -o "out/${{ matrix.page }}.html" -w "%{http_code} %{url_effective}" \
                          "http://127.0.0.1:8888/docs/Pages/${{ matrix.page }}.php")
          code=${result%% *}
          final=${result#* }
          # Pages that need a login redirect to login.php (there is no database here).
          kind=page
          case "$final" in */login.php*) [ "${{ matrix.page }}" != "login" ] && kind=login ;; esac
          echo "${{ matrix.page }} $code $kind" > "out/${{ matrix.page }}.status"
          echo "HTTP $code ($final)"
          if [ "$kind" = "login" ]; then
            echo "::notice title=${{ matrix.page }}.php::Needs a login, so the online preview shows the login page."
          elif [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && [ -s "out/${{ matrix.page }}.html" ]; then
            echo "✅ ${{ matrix.page }} built"
          else
            echo "::warning title=${{ matrix.page }}.php::Returned HTTP $code. This page needs the database or backend, so it only fully works locally."
          fi

      - name: Save built page
        uses: actions/upload-artifact@v7
        with:
          name: page-${{ matrix.page }}
          path: out/
          retention-days: 1

  # 3. Collect all pages, write the status report and prepare the site
  report-build-status:
    name: Report build status
    needs: build-page
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Collect built pages
        uses: actions/download-artifact@v8
        with:
          pattern: page-*
          path: pages
          merge-multiple: true

      - name: Write build report
        run: |
          shopt -s nullglob
          {
            echo "## DiSSENT page build report"
            echo ""
            echo "| Page | HTTP status | Result |"
            echo "|---|---|---|"
            for s in pages/*.status; do
              read -r name code kind < "$s"
              if [ "$kind" = "login" ]; then
                result="🔒 Needs login (preview shows the login page)"
              elif [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                result="✅ Built"
              else
                result="⚠️ Needs backend (works locally only)"
              fi
              echo "| $name | $code | $result |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble site
        run: |
          shopt -s nullglob
          mkdir -p _site/docs/Pages
          cp pages/*.html _site/docs/Pages/
          cp -r docs/assets _site/docs/assets
          if [ -d site ]; then cp -r site _site/site; fi

          # Make links point to the HTML versions of the pages
          find _site -name "*.html" -exec sed -i -E 's/([A-Za-z0-9_-]+)\.php/\1.html/g' {} +

          # Online preview mode: GitHub Pages cannot receive form data (it would return
          # "405 Not Allowed"). preview-mode.js stops forms before they are sent and shows
          # a small message box below the form instead. No permanent banner.
          cat > _site/docs/assets/preview-mode.js <<'EOF'
          (function () {
            // Online preview only (GitHub Pages cannot receive form data).
            // Forms are stopped before they are sent, so there are no "405" errors,
            // and a small message box explains why.
            var MESSAGE = 'This is a preview of DiSSENT. Login, registration and messaging ' +
                          'work in the full version. Please contact the DiSSENT team for a demo.';

            var style = document.createElement('style');
            style.textContent =
              '.preview-note{display:flex;align-items:flex-start;gap:12px;margin:16px 0 0;' +
              'padding:14px 16px;border:1px solid #bdcadf;border-left:4px solid #354f91;' +
              'border-radius:10px;background:#f1f5fb;color:#10244d;font:15px/1.5 Arial,sans-serif;' +
              'text-align:left;box-shadow:0 6px 18px rgba(16,36,77,.12)}' +
              '.preview-note p{margin:0;flex:1}' +
              '.preview-note a{color:#354f91;font-weight:700}' +
              '.preview-note button{flex:0 0 auto;min-width:44px;min-height:44px;margin:-10px -8px -10px 0;' +
              'border:0;border-radius:8px;background:transparent;color:#10244d;font-size:22px;cursor:pointer}' +
              '.preview-note button:hover{background:#dfe8f7}' +
              '.preview-note--floating{position:fixed;top:84px;left:50%;z-index:2000;width:min(520px,calc(100% - 32px));' +
              'margin:0;transform:translateX(-50%)}';
            document.head.appendChild(style);

            function showNote(form) {
              // Forms in the header (search) get a floating box; other forms get one right below them.
              var floating = !!form.closest('#siteHeader');
              var note = floating ? document.getElementById('previewNoteFloating') : form.nextElementSibling;

              if (!note || !note.classList || !note.classList.contains('preview-note')) {
                note = document.createElement('div');
                note.className = 'preview-note' + (floating ? ' preview-note--floating' : '');
                note.setAttribute('role', 'status');
                if (floating) { note.id = 'previewNoteFloating'; }

                var text = document.createElement('p');
                text.appendChild(document.createTextNode(MESSAGE + ' '));
                var contact = document.createElement('a');
                contact.href = 'contact_us.html';
                contact.textContent = 'Contact us';
                text.appendChild(contact);

                var close = document.createElement('button');
                close.type = 'button';
                close.setAttribute('aria-label', 'Close message');
                close.textContent = '×';
                close.addEventListener('click', function () { note.remove(); });

                note.appendChild(text);
                note.appendChild(close);

                if (floating) { document.body.appendChild(note); }
                else { form.insertAdjacentElement('afterend', note); }
              }

              note.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            // Capture phase: runs before the page's own scripts, so nothing is sent.
            document.addEventListener('submit', function (event) {
              event.preventDefault();
              event.stopImmediatePropagation();
              showNote(event.target);
            }, true);
          })();
          EOF
          for f in _site/docs/Pages/*.html; do
            sed -i 's#</body>#<script src="../assets/preview-mode.js"></script></body>#' "$f"
          done

          # Homepage redirect
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=docs/Pages/home.html">
            <title>DiSSENT</title>
          </head>
          <body>
            <p>Opening DiSSENT… <a href="docs/Pages/home.html">Click here</a> if nothing happens.</p>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

          if [ ! -s _site/docs/Pages/home.html ]; then
            echo "::error title=home.php::The homepage did not build, so the site was not deployed."
            exit 1
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ leaves out dotfiles by default; keep .nojekyll in the site.
          include-hidden-files: true

  # 4. Publish to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    needs: report-build-status
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
